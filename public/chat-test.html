<!DOCTYPE html>
<html>
<head>
    <title>Chatbot Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        button:hover { background: #555; }
        .status { padding: 10px; margin: 10px 0; background: #222; border-radius: 4px; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
    </style>
</head>
<body>
    <h1>🤖 Chatbot Test Page</h1>
    <p>This page tests if the MagicChat chatbot can load and initialize.</p>
    
    <div class="status" id="status">
        <span class="info">⏳ Checking...</span>
    </div>
    
    <div>
        <button onclick="initChat()">Initialize Chat</button>
        <button onclick="openChat()">Open Chat</button>
        <button onclick="closeChat()">Close Chat</button>
        <button onclick="checkStatus()">Check Status</button>
    </div>
    
    <div style="margin-top: 20px; font-size: 12px; color: #888;">
        <p>Open browser console (F12) to see detailed logs.</p>
        <p>CDN URL: <span id="cdnUrl">Loading...</span></p>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const cdnUrlSpan = document.getElementById('cdnUrl');
        
        // Try multiple CDN sources
        const cdns = [
            'https://magicchat-core.github.io/dev-ssc-client-cdns/bundle.js',
            'https://cdn.jsdelivr.net/npm/chathead-consumer-client/dist/bundle.js',
            'https://unpkg.com/chathead-consumer-client/dist/bundle.js'
        ];
        
        let currentCdnIndex = 0;
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        async function loadChatbot() {
            for (let i = 0; i < cdns.length; i++) {
                try {
                    cdnUrlSpan.textContent = cdns[i];
                    await loadScript(cdns[i]);
                    if (window.magicchat_io) {
                        statusDiv.innerHTML = `<span class="success">✅ Chatbot loaded from CDN ${i + 1}</span>`;
                        console.log('✅ Loaded from:', cdns[i]);
                        return true;
                    }
                } catch (e) {
                    console.warn('Failed to load from:', cdns[i]);
                }
            }
            statusDiv.innerHTML = `<span class="error">❌ Failed to load from all CDNs</span>`;
            return false;
        }
        
        async function initChat() {
            statusDiv.innerHTML = `<span class="info">⏳ Initializing...</span>`;
            
            // Load if not already loaded
            if (!window.magicchat_io) {
                const loaded = await loadChatbot();
                if (!loaded) {
                    statusDiv.innerHTML = `<span class="error">❌ Chatbot library not loaded</span>`;
                    return;
                }
            }
            
            try {
                await window.magicchat_io.setUp(
                    'appv2',
                    'dXNlcjExX19TRVBSQVRPUl9fYXBwdjI=',
                    'US',
                    'V2',
                    false,
                    ''
                );
                await window.magicchat_io.initialize();
                statusDiv.innerHTML = `<span class="success">✅ Chatbot initialized successfully!</span>`;
                console.log('✅ Chatbot initialized!');
                alert('✅ Chatbot initialized! Click "Open Chat" to see it.');
            } catch(e) {
                statusDiv.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
                console.error('Error:', e);
                alert('Error: ' + e.message);
            }
        }
        
        function openChat() {
            if (window.magicchat_io?.open) {
                window.magicchat_io.open();
                statusDiv.innerHTML = `<span class="success">✅ Chat opened</span>`;
            } else {
                statusDiv.innerHTML = `<span class="error">❌ Chat not initialized! Click "Initialize Chat" first.</span>`;
                alert('Chat not initialized! Click "Initialize Chat" first.');
            }
        }
        
        function closeChat() {
            if (window.magicchat_io?.close) {
                window.magicchat_io.close();
                statusDiv.innerHTML = `<span class="info">⏹️ Chat closed</span>`;
            } else {
                alert('Chat not initialized!');
            }
        }
        
        function checkStatus() {
            const loaded = !!window.magicchat_io;
            const hasOpen = loaded ? typeof window.magicchat_io.open === 'function' : false;
            statusDiv.innerHTML = `
                <div>Loaded: ${loaded ? '✅' : '❌'}</div>
                <div>Has open method: ${hasOpen ? '✅' : '❌'}</div>
                <div>CDN: ${cdnUrlSpan.textContent}</div>
            `;
            console.log('Status:', { loaded, hasOpen });
        }
        
        // Auto load
        loadChatbot();
    </script>
</body>
</html>
