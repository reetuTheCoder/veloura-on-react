<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloura | West Hollywood</title>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Load chatbot scripts -->
    <script src="https://cdn.socket.io/4.1.2/socket.io.min.js"></script>
    
    <!-- Try multiple CDN sources for MagicChat -->
    <script>
      // Function to load script with fallback
      function loadScript(src, fallbackSrc) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => {
            if (fallbackSrc) {
              console.warn(`Failed to load ${src}, trying fallback...`);
              loadScript(fallbackSrc).then(resolve).catch(reject);
            } else {
              reject(new Error(`Failed to load ${src}`));
            }
          };
          document.head.appendChild(script);
        });
      }

      // Load MagicChat from multiple CDN sources
      (async function() {
        const cdns = [
          'https://magicchat-core.github.io/dev-ssc-client-cdns/bundle.js',
          'https://cdn.jsdelivr.net/npm/chathead-consumer-client/dist/bundle.js',
          'https://unpkg.com/chathead-consumer-client/dist/bundle.js'
        ];
        
        for (const cdn of cdns) {
          try {
            await loadScript(cdn);
            if (window.magicchat_io) {
              console.log('✅ MagicChat loaded from:', cdn);
              break;
            }
          } catch (e) {
            console.warn('Failed to load from:', cdn);
          }
        }
        
        if (!window.magicchat_io) {
          console.error('❌ Failed to load MagicChat from all CDNs');
        }
      })();
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
